[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ar_pdf_export"
version = "0.0.1"
description = "Branded, letterhead-aware PDF export for standard ERPNext reports"
authors = [{ name = "Metadaftr", email = "support@metadaftr.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["ar_pdf_export", "ar_pdf_export.utils"]
